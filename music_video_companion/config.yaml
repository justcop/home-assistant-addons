name: Music Video Companion
version: "0.4.0"
slug: music_video_companion
description: Discover approved official music videos for playing tracks and cast them to a TV.
url: https://github.com/justcop/home-assistant-addons/tree/main/music_video_companion
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
stage: experimental
ingress: true
ingress_port: 8099
panel_icon: mdi:youtube-tv
panel_title: Music Video Companion
panel_admin: true
homeassistant_api: true
backup: cold
watchdog: http://[HOST]:8099/health
options:
  youtube_api_key: ""
  ha_access_token: ""
  source_api_token: ""
  poll_seconds: 3
  spotify_refresh_seconds: 10
schema:
  youtube_api_key: password?
  ha_access_token: password?
  source_api_token: password?
  poll_seconds: int(2,30)
  spotify_refresh_seconds: int(0,60)
