name: WhatsApp MCP (Read Only)
version: 0.3.23
slug: whatsapp_mcp
description: Private, read-only WhatsApp search over MCP with Cloudflare Access JWT
  verification.
url: https://github.com/justcop/home-assistant-addons/tree/main/whatsapp_mcp
arch:
- amd64
startup: application
boot: manual
init: false
stage: experimental
backup_exclude:
- whatsapp
- whatsapp/**
- .whatsapp-cloud-backup
- .whatsapp-cloud-backup/**
panel_icon: mdi:message-text-lock
panel_title: WhatsApp Archive
panel_admin: true
homeassistant_api: true
ingress: true
ingress_port: 8100
map:
- type: share
  read_only: false
  path: /share
- type: media
  read_only: false
  path: /media
ports:
  8099/tcp: null
ports_description:
  8099/tcp: MCP gateway (Cloudflare Access JWT required). Do not publish directly.
options:
  phone_number: ''
  access_team_domain: ''
  access_audience: ''
  allowed_email: ''
  storage_path: ''
schema:
  phone_number: str?
  access_team_domain: str?
  access_audience: str?
  allowed_email: str?
  storage_path: str?
image: ghcr.io/justcop/whatsapp-mcp-{arch}
