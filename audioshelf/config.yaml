name: AudioShelf
version: "0.3.0"
slug: audioshelf
description: Your album collection, with original tracklists and Spotify playback.
url: https://github.com/justcop/home-assistant-addons/tree/main/audioshelf
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
stage: experimental
ingress: true
ingress_port: 8099
panel_icon: mdi:album
panel_title: AudioShelf
ports:
  8099/tcp: 8098
ports_description:
  8099/tcp: Standalone mobile UI and Spotify callback. Protect external access with your proxy or web password.
map:
  - type: share
    read_only: false
options:
  data_directory: /share/audioshelf
  cache_directory: /share/audioshelf-cache
  spotify_client_id: ""
  spotify_redirect_uri: ""
  spotify_market: GB
  web_password: ""
schema:
  data_directory: str
  cache_directory: str
  spotify_client_id: str?
  spotify_redirect_uri: str?
  spotify_market: str
  web_password: password?
