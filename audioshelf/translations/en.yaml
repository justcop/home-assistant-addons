configuration:
  data_directory:
    name: Collection folder
    description: Local persistent folder for the database and backups. Default /share/audioshelf.
  cache_directory:
    name: Replaceable cache folder
    description: Artwork downloads and API metadata, separate from the collection. Can be excluded from backups. Default /share/audioshelf-cache.
  spotify_client_id:
    name: Spotify client ID
    description: From your Spotify developer app. No client secret is needed.
  spotify_redirect_uri:
    name: Spotify redirect URI
    description: Your exact registered HTTPS address ending in /auth/spotify/callback.
  spotify_market:
    name: Spotify country
    description: Two-letter country code, GB by default.
  web_password:
    name: Standalone web password
    description: Required for standalone access. Use a long unique password and HTTPS. Ingress uses Home Assistant authentication.
  allow_support_access:
    name: Allow temporary support access (advanced)
    description: Off by default. Enables owner-created expiring logins under AudioShelf Settings → Security. Turning this off revokes all support logins.
network:
  8099/tcp: Standalone AudioShelf web interface and Spotify callback
