<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 215 125" width="215" height="125" role="img" aria-label="In collection">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2=".82" y2="1">
      <stop offset="0" stop-color="#f6eed5"/><stop offset=".47" stop-color="#e0ddc1"/><stop offset="1" stop-color="#d3d1ac"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-30%" width="170%" height="190%"><feGaussianBlur stdDeviation="3.3"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".68" numOctaves="3" seed="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="bleed" x="-12%" y="-25%" width="124%" height="160%"><feGaussianBlur stdDeviation=".58"/></filter>
    <clipPath id="cut"><path d="M 17 16 L 62.32 14 L 131.48000000000002 15 L 192 13 Q 198 15 197 20 L 196 53.48 L 197 95 L 190 105 L 116.92000000000002 104 L 53.22 106 L 19 104 Q 15 102 16 96 L 15 55.32 Z"/></clipPath>
  </defs>
  <g transform="rotate(-2 107.5 62.5)">
    <!-- Paper edges cast a soft, directional shadow onto the record sleeve. -->
    <path d="M 17 16 L 62.32 14 L 131.48000000000002 15 L 192 13 Q 198 15 197 20 L 196 53.48 L 197 95 L 190 105 L 116.92000000000002 104 L 53.22 106 L 19 104 Q 15 102 16 96 L 15 55.32 Z" fill="#100d09" opacity=".32" transform="translate(4 6)" filter="url(#shadow)"/>
    <path d="M 17 16 L 62.32 14 L 131.48000000000002 15 L 192 13 Q 198 15 197 20 L 196 53.48 L 197 95 L 190 105 L 116.92000000000002 104 L 53.22 106 L 19 104 Q 15 102 16 96 L 15 55.32 Z" fill="url(#paper)" stroke="#87947b" stroke-width="1.25" stroke-linejoin="round"/>
    <g clip-path="url(#cut)">
      <rect x="15" y="13" width="184" height="94" filter="url(#grain)" opacity=".12"/>
      <path d="M21 20Q107.5 14 192 20" fill="none" stroke="#fffdf1" opacity=".5" stroke-width="1.7"/>
      <path d="M18 102 Q107.5 107 193 101" fill="none" stroke="#6c5434" stroke-opacity=".12" stroke-width="2"/>
      <path d="M25 36l9 -4M175 91l12 -3M162 87l2 -6" stroke="#fff8dc" opacity=".38" stroke-width="1.3"/><circle cx="127.84" cy="70.03999999999999" r="1.1" fill="#f6eed5" opacity=".85"/>
      <!-- Faint offset printing creates a slightly imperfect letterpress impression. -->
      <g fill="#345644" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" transform="translate(.55 .45)" filter="url(#bleed)" opacity=".2"><text x="106.5" y="62.5" font-size="23" font-weight="800" letter-spacing="1.1">IN</text><text x="106.5" y="89.5" font-size="27" font-weight="900" letter-spacing="1.1">COLLECTION</text></g>
    </g>
    <path d="M 24 23 L 185 22 L 186 93 L 25 95 Z" fill="none" stroke="#87947b" stroke-opacity=".65" stroke-width=".85" stroke-dasharray="18 1 .8 1"/>
    <g clip-path="url(#cut)" fill="#345644" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">
      <text x="106.5" y="37" font-size="9" font-weight="650" letter-spacing="2">YOUR RECORD SHELF</text>
      <g><text x="106.5" y="62.5" font-size="23" font-weight="800" letter-spacing="1.1">IN</text><text x="106.5" y="89.5" font-size="27" font-weight="900" letter-spacing="1.1">COLLECTION</text></g>
      
    </g>
    <!-- A tiny corner curl catches the light without looking like a button. -->
    <path d="M179 104 Q189 95 192 89 Q194 96 190 105" fill="#fff5db" stroke="#87947b" stroke-opacity=".55" stroke-width=".75"/>
    <path d="M179 104 Q185 97 192 89" fill="none" stroke="#fff9e8" stroke-opacity=".6" stroke-width="1.1"/>
  </g>
</svg>
