<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 145 75" width="145" height="75" role="img" aria-label="On loan">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2=".82" y2="1">
      <stop offset="0" stop-color="#fff0cd"/><stop offset=".47" stop-color="#ecd8ae"/><stop offset="1" stop-color="#dcc69a"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-30%" width="170%" height="190%"><feGaussianBlur stdDeviation="3.3"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".68" numOctaves="3" seed="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="bleed" x="-12%" y="-25%" width="124%" height="160%"><feGaussianBlur stdDeviation=".58"/></filter>
    <clipPath id="cut"><path d="M 17 16 L 44.120000000000005 14 L 86.68 15 L 122 13 Q 128 15 127 20 L 126 31.48 L 127 45 L 120 55 L 77.72 54 L 38.519999999999996 56 L 19 54 Q 15 52 16 46 L 15 32.32 Z"/></clipPath>
  </defs>
  <g transform="rotate(1 72.5 37.5)">
    <!-- Paper edges cast a soft, directional shadow onto the record sleeve. -->
    <path d="M 17 16 L 44.120000000000005 14 L 86.68 15 L 122 13 Q 128 15 127 20 L 126 31.48 L 127 45 L 120 55 L 77.72 54 L 38.519999999999996 56 L 19 54 Q 15 52 16 46 L 15 32.32 Z" fill="#100d09" opacity=".32" transform="translate(4 6)" filter="url(#shadow)"/>
    <path d="M 17 16 L 44.120000000000005 14 L 86.68 15 L 122 13 Q 128 15 127 20 L 126 31.48 L 127 45 L 120 55 L 77.72 54 L 38.519999999999996 56 L 19 54 Q 15 52 16 46 L 15 32.32 Z" fill="url(#paper)" stroke="#ae916a" stroke-width="1.25" stroke-linejoin="round"/>
    <g clip-path="url(#cut)">
      <rect x="15" y="13" width="114" height="44" filter="url(#grain)" opacity=".12"/>
      <path d="M21 20Q72.5 14 122 20" fill="none" stroke="#fffdf1" opacity=".5" stroke-width="1.7"/>
      <path d="M18 52 Q72.5 57 123 51" fill="none" stroke="#6c5434" stroke-opacity=".12" stroke-width="2"/>
      <path d="M25 36l9 -4M105 41l12 -3M92 37l2 -6" stroke="#fff8dc" opacity=".38" stroke-width="1.3"/><circle cx="84.44" cy="39.04" r="1.1" fill="#fff0cd" opacity=".85"/>
      <!-- Faint offset printing creates a slightly imperfect letterpress impression. -->
      <g fill="#744534" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" transform="translate(.55 .45)" filter="url(#bleed)" opacity=".2"><text x="71.5" y="46.5" font-size="22" font-weight="900" letter-spacing="1.5">ON LOAN</text></g>
    </g>
    <path d="M 24 23 L 115 22 L 116 43 L 25 45 Z" fill="none" stroke="#ae916a" stroke-opacity=".65" stroke-width=".85" stroke-dasharray="18 1 .8 1"/>
    <g clip-path="url(#cut)" fill="#744534" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">
      
      <g><text x="71.5" y="46.5" font-size="22" font-weight="900" letter-spacing="1.5">ON LOAN</text></g>
      
    </g>
    <!-- A tiny corner curl catches the light without looking like a button. -->
    <path d="M109 54 Q119 45 122 39 Q124 46 120 55" fill="#fff5db" stroke="#ae916a" stroke-opacity=".55" stroke-width=".75"/>
    <path d="M109 54 Q115 47 122 39" fill="none" stroke="#fff9e8" stroke-opacity=".6" stroke-width="1.1"/>
  </g>
</svg>
