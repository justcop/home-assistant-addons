<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 182 75" width="182" height="75" role="img" aria-label="On your shelf">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2=".82" y2="1">
      <stop offset="0" stop-color="#f6f0d8"/><stop offset=".47" stop-color="#e5e2c6"/><stop offset="1" stop-color="#d7d5b8"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-30%" width="170%" height="190%"><feGaussianBlur stdDeviation="3.3"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".68" numOctaves="3" seed="9" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="bleed" x="-12%" y="-25%" width="124%" height="160%"><feGaussianBlur stdDeviation=".58"/></filter>
    <clipPath id="cut"><path d="M 17 16 L 53.74 14 L 110.36 15 L 159 13 Q 165 15 164 20 L 163 31.48 L 164 45 L 157 55 L 98.44000000000001 54 L 46.29 56 L 19 54 Q 15 52 16 46 L 15 32.32 Z"/></clipPath>
  </defs>
  <g transform="rotate(-1.4 91 37.5)">
    <!-- Paper edges cast a soft, directional shadow onto the record sleeve. -->
    <path d="M 17 16 L 53.74 14 L 110.36 15 L 159 13 Q 165 15 164 20 L 163 31.48 L 164 45 L 157 55 L 98.44000000000001 54 L 46.29 56 L 19 54 Q 15 52 16 46 L 15 32.32 Z" fill="#100d09" opacity=".32" transform="translate(4 6)" filter="url(#shadow)"/>
    <path d="M 17 16 L 53.74 14 L 110.36 15 L 159 13 Q 165 15 164 20 L 163 31.48 L 164 45 L 157 55 L 98.44000000000001 54 L 46.29 56 L 19 54 Q 15 52 16 46 L 15 32.32 Z" fill="url(#paper)" stroke="#8b937a" stroke-width="1.25" stroke-linejoin="round"/>
    <g clip-path="url(#cut)">
      <rect x="15" y="13" width="151" height="44" filter="url(#grain)" opacity=".12"/>
      <path d="M21 20Q91 14 159 20" fill="none" stroke="#fffdf1" opacity=".5" stroke-width="1.7"/>
      <path d="M18 52 Q91 57 160 51" fill="none" stroke="#6c5434" stroke-opacity=".12" stroke-width="2"/>
      <path d="M31 36l8 2M136 28l11 -1" stroke="#fff8e6" opacity=".48" stroke-width="1.4"/>
      <!-- Faint offset printing creates a slightly imperfect letterpress impression. -->
      <g fill="#426046" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" transform="translate(.55 .45)" filter="url(#bleed)" opacity=".2"><text x="90" y="46.5" font-size="18" font-weight="900" letter-spacing="1.5">ON YOUR SHELF</text></g>
    </g>
    <path d="M 24 23 L 152 22 L 153 43 L 25 45 Z" fill="none" stroke="#8b937a" stroke-opacity=".65" stroke-width=".85" stroke-dasharray="33 .7 16 .4"/>
    <g clip-path="url(#cut)" fill="#426046" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">
      
      <g><text x="90" y="46.5" font-size="18" font-weight="900" letter-spacing="1.5">ON YOUR SHELF</text></g>
      
    </g>
    <!-- A tiny corner curl catches the light without looking like a button. -->
    <path d="M146 54 Q156 45 159 39 Q161 46 157 55" fill="#fff5db" stroke="#8b937a" stroke-opacity=".55" stroke-width=".75"/>
    <path d="M146 54 Q152 47 159 39" fill="none" stroke="#fff9e8" stroke-opacity=".6" stroke-width="1.1"/>
  </g>
</svg>
