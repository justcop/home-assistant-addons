<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 112" width="176" height="112" role="img" aria-label="Loan">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2=".82" y2="1">
      <stop offset="0" stop-color="#f5e9ca"/><stop offset=".47" stop-color="#e5d2a7"/><stop offset="1" stop-color="#d4b998"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-30%" width="170%" height="190%"><feGaussianBlur stdDeviation="3.3"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".68" numOctaves="3" seed="13" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="bleed" x="-12%" y="-25%" width="124%" height="160%"><feGaussianBlur stdDeviation=".58"/></filter>
    <clipPath id="cut"><path d="M 17 16 L 52.18 14 L 106.52 15 L 153 13 Q 159 15 158 20 L 157 47.76 L 158 82 L 151 92 L 95.08000000000001 91 L 45.03 93 L 19 91 Q 15 89 16 83 L 15 49.34 Z"/></clipPath>
  </defs>
  <g transform="rotate(-3.3 88 56)">
    <!-- Paper edges cast a soft, directional shadow onto the record sleeve. -->
    <path d="M 17 16 L 52.18 14 L 106.52 15 L 153 13 Q 159 15 158 20 L 157 47.76 L 158 82 L 151 92 L 95.08000000000001 91 L 45.03 93 L 19 91 Q 15 89 16 83 L 15 49.34 Z" fill="#100d09" opacity=".32" transform="translate(4 6)" filter="url(#shadow)"/>
    <path d="M 17 16 L 52.18 14 L 106.52 15 L 153 13 Q 159 15 158 20 L 157 47.76 L 158 82 L 151 92 L 95.08000000000001 91 L 45.03 93 L 19 91 Q 15 89 16 83 L 15 49.34 Z" fill="url(#paper)" stroke="#a7906f" stroke-width="1.25" stroke-linejoin="round"/>
    <g clip-path="url(#cut)">
      <rect x="15" y="13" width="145" height="81" filter="url(#grain)" opacity=".12"/>
      <path d="M21 20Q88 14 153 20" fill="none" stroke="#fffdf1" opacity=".5" stroke-width="1.7"/>
      <path d="M18 89 Q88 94 154 88" fill="none" stroke="#6c5434" stroke-opacity=".12" stroke-width="2"/>
      <path d="M31 73l8 2M130 28l11 -1" stroke="#fff8e6" opacity=".48" stroke-width="1.4"/>
      <!-- Faint offset printing creates a slightly imperfect letterpress impression. -->
      <g fill="#774a37" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" transform="translate(.55 .45)" filter="url(#bleed)" opacity=".2"><text x="87" y="71" font-size="39" font-weight="900" letter-spacing="1.5">LOAN</text></g>
    </g>
    <path d="M 24 23 L 146 22 L 147 80 L 25 82 Z" fill="none" stroke="#a7906f" stroke-opacity=".65" stroke-width=".85" stroke-dasharray="33 .7 16 .4"/>
    <g clip-path="url(#cut)" fill="#774a37" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">
      <text x="87" y="37" font-size="9" font-weight="650" letter-spacing="2">LISTENING ROOM</text>
      <g><text x="87" y="71" font-size="39" font-weight="900" letter-spacing="1.5">LOAN</text></g>
      <text x="87" y="79" font-size="8.2" font-weight="700" letter-spacing="1.45">RETURN WHEN READY</text>
    </g>
    <!-- A tiny corner curl catches the light without looking like a button. -->
    <path d="M140 91 Q150 82 153 76 Q155 83 151 92" fill="#fff5db" stroke="#a7906f" stroke-opacity=".55" stroke-width=".75"/>
    <path d="M140 91 Q146 84 153 76" fill="none" stroke="#fff9e8" stroke-opacity=".6" stroke-width="1.1"/>
  </g>
</svg>
