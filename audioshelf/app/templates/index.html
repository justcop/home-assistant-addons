<!doctype html>
<html lang="en" data-asset-version="{{ asset_version }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f0e6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="AudioShelf">
  <base href="{{ base }}">
  <title>AudioShelf</title>
  <link rel="icon" href="static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="static/icon-192.png">
  <link rel="manifest" href="static/manifest.webmanifest">
  <link rel="stylesheet" href="static/style.css?v={{ asset_version }}">
  <link rel="stylesheet" href="static/vinyl.css?v={{ asset_version }}">
  <script src="static/vinyl.js?v={{ asset_version }}" defer></script>
  <script src="static/app.js?v={{ asset_version }}" defer></script>
</head>
<body>
  <header class="masthead">
    <a class="brand" href="#shelf" aria-label="AudioShelf home"><img src="static/icon.svg" alt="" width="36" height="36"><span>AudioShelf<small>Good records. Your collection.</small></span></a>
    <a href="#settings" class="settings-link" aria-label="Open settings">Settings <span aria-hidden="true">↗</span></a>
  </header>
  <aside id="app-update" class="note" role="status" hidden><span>Update available. Finish any edits before reloading.</span> <button type="button" class="secondary" id="reload-update">Reload AudioShelf</button></aside>
  <main id="content" tabindex="-1"><div class="loading">Opening your shelf…</div></main>
  <aside id="turntable" aria-label="On the turntable" hidden></aside>
  <nav class="bottom-nav" aria-label="Main navigation"><a href="#shelf" data-nav="shelf"><span aria-hidden="true">▤</span> My shelf</a><a href="#store" data-nav="store"><span aria-hidden="true">⊕</span> Record store</a></nav>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="modal"><div id="modal-content"></div><button type="button" class="quiet close-modal">Close</button></dialog>
</body>
</html>
