name: Vinyl Guardian tests

on:
  push:
    branches:
      - vinyl-guardian-detection-v2
    paths:
      - "vinyl_guardian/**"
      - ".github/workflows/vinyl-guardian-tests.yml"
  pull_request:
    paths:
      - "vinyl_guardian/**"
      - ".github/workflows/vinyl-guardian-tests.yml"
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check numpy PyYAML
      - name: Check run.sh syntax
        run: bash -n vinyl_guardian/run.sh
      - name: Compile all Python sources
        run: python -m compileall -q vinyl_guardian
      - name: Run detector and experiment tests
        run: python -m unittest discover -s vinyl_guardian/tests -p "test_*.py" -v
