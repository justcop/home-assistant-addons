name: Vinyl Guardian tests

on:
  push:
    branches:
      - main
    paths:
      - 'vinyl_guardian/**'
      - '.github/scripts/test_calibration_screen.cjs'
      - '.github/workflows/vinyl-guardian-tests.yml'
  pull_request:
    paths:
      - 'vinyl_guardian/**'
      - '.github/scripts/test_calibration_screen.cjs'
      - '.github/workflows/vinyl-guardian-tests.yml'
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy PyYAML pytest requests pyflakes
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
      - name: Check launcher syntax and Python compilation
        run: |
          bash -n vinyl_guardian/run.sh
          python -m compileall -q vinyl_guardian
      - name: Check runtime names
        run: |
          output="$(python -m pyflakes vinyl_guardian/vinyl_guardian.py vinyl_guardian/integrations.py vinyl_guardian/recognition_session.py 2>&1 || true)"
          echo "$output"
          if echo "$output" | grep -Eq "undefined name '[^\']+'"; then
            echo "Undefined runtime name detected." >&2
            exit 1
          fi
      - name: Run runtime tests
        run: python -m unittest discover -s vinyl_guardian/tests -p 'test_*.py' -v
      - name: Build Vinyl Guardian image
        run: |
          docker build --pull \
            --build-arg BUILD_VERSION=test \
            --build-arg BUILD_ARCH=amd64 \
            -t vinyl-guardian-test \
            vinyl_guardian
      - name: Smoke-test runtime imports in built image
        run: |
          docker run --rm --entrypoint python3 vinyl-guardian-test -c "import audioop; from shazamio import Shazam; import pydub; print('Shazam runtime imports OK')"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Check desktop and mobile calibration screen through an ingress path
        run: node .github/scripts/test_calibration_screen.cjs
