name: AudioShelf Android helper APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'audioshelf/android-helper/**'
      - '.github/workflows/audioshelf-android-helper.yml'
  pull_request:
    paths:
      - 'audioshelf/android-helper/**'
      - '.github/workflows/audioshelf-android-helper.yml'
permissions:
  contents: read
concurrency:
  group: audioshelf-helper-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Fetch pinned Spotify App Remote SDK
        working-directory: audioshelf/android-helper
        run: ./prepare-sdk.sh
      - name: Prepare signing key
        working-directory: audioshelf/android-helper
        env:
          KEYSTORE_BASE64: ${{ secrets.AUDIOSHELF_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.AUDIOSHELF_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            test -n "$KEYSTORE_PASSWORD"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > prototype.keystore
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            if [ "$GITHUB_REF" = 'refs/heads/main' ]; then
              echo 'Stable signing secrets are required for published helper updates.' >&2
              exit 1
            fi
            keytool -genkeypair -keystore prototype.keystore -storepass audioshelf-prototype -keypass audioshelf-prototype -alias prototype -keyalg RSA -keysize 2048 -validity 3650 -dname 'CN=AudioShelf Test, O=justcop, C=GB'
            echo 'Test key generated. Without signing secrets, each build has a different fingerprint and requires a fresh install.' >> "$GITHUB_STEP_SUMMARY"
          fi
          keytool -list -v -keystore prototype.keystore -storepass "${KEYSTORE_PASSWORD:-audioshelf-prototype}" | sed -n '/SHA1:/p' | tee signing-fingerprint.txt
          cat signing-fingerprint.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Build and lint sideloaded prototype
        working-directory: audioshelf/android-helper
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
      - name: Validate update metadata
        working-directory: audioshelf/android-helper
        run: python prepare-release.py .
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: audioshelf-spotify-helper-0.1.8
          path: |
            audioshelf/android-helper/app/build/outputs/apk/debug/app-debug.apk
            audioshelf/android-helper/signing-fingerprint.txt
          retention-days: 7
      - name: Write installation notes
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'NOTES'
          Download and unzip the APK artifact, then install app-debug.apk on your Android phone.
          Configure your Spotify developer app using the helper README before enabling the helper in AudioShelf Settings.
          Use the fingerprint from this build when configuring Spotify. Set signing secrets for consistent fingerprints and installable updates.
          NOTES
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: audioshelf-spotify-helper-0.1.8
          path: helper-release
      - name: Prepare verified update metadata
        run: python audioshelf/android-helper/prepare-release.py helper-release
      - name: Publish helper update channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" != "$GITHUB_SHA" ]; then
            echo 'A newer main commit exists; leaving the update channel unchanged.'
            exit 0
          fi
          if ! gh release view audioshelf-helper >/dev/null 2>&1; then
            gh release create audioshelf-helper --target "$GITHUB_SHA" --title 'AudioShelf Android Helper' --latest=false --notes 'Signed Android helper updates. Open the installed helper to check for updates.'
          fi
          gh release upload audioshelf-helper helper-release/AudioShelf-Helper.apk --clobber
          gh release upload audioshelf-helper helper-release/audioshelf-helper-update.json --clobber
