name: WhatsApp full-history isolated trial image tests
on:
  pull_request:
    paths:
      - 'whatsapp_fullsync_trial/**'
      - '.github/workflows/whatsapp-fullsync-trial-tests.yml'
  workflow_dispatch:
jobs:
  trial-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build isolated trial image (no pairing)
        run: docker build --pull --tag whatsapp-fullsync-trial:test whatsapp_fullsync_trial
      - name: Verify patched code and isolation (no network)
        run: |
          docker run --rm --network none --entrypoint node whatsapp-fullsync-trial:test -e '
            const fs=require("node:fs"),assert=require("node:assert/strict");
            const conn=fs.readFileSync("/opt/whatsapp-api/dist/whatsapp/connection.js","utf8");
            const run=fs.readFileSync("/opt/whatsapp-addon/run.mjs","utf8");
            assert.match(conn,/windows\("Desktop"\)/);
            assert.match(conn,/Browsers\.macOS\("Safari"\)/);
            assert.match(conn,/auth\.state\.creds\.account/);
            assert.doesNotMatch(conn,/macOS\("Desktop"\)/);
            assert.doesNotMatch(conn,/macOS\("Safari"\)/);
            assert.match(conn,/syncFullHistory: true/);
            assert.match(conn,/shouldSyncHistoryMessage: \(\) => true/);
            assert.match(conn,/PAIRING_CODE_FILE/);
            assert.match(conn,/PAIRING_MODE_FILE/);
            assert.match(run,/const DEFAULT_PAIRING_MODE = \x27qr\x27/);
            const qrView=fs.readFileSync("/opt/whatsapp-addon/archive-ui/index.html","utf8");
            assert.match(qrView,/id="pairing-qr-image"/);
            assert.match(conn,/resettingPairing/);
            const page=fs.readFileSync("/opt/whatsapp-addon/archive-ui/index.html","utf8");
            assert.match(page,/id="pairing-banner"/);
            assert.match(page,/id="pairing-repair"/);
            assert.match(run,/WHATSAPP_HISTORY_BACKFILL: .1./);
            const worker=fs.readFileSync("/opt/whatsapp-api/dist/history-backfill.js","utf8");
            const messageRepo=fs.readFileSync("/opt/whatsapp-api/dist/db/messages.js","utf8");
            const ingest=fs.readFileSync("/opt/whatsapp-api/dist/whatsapp/ingest.js","utf8");
            const archive=fs.readFileSync("/opt/whatsapp-addon/archive-server.mjs","utf8");
            assert.match(worker,/trial-recovery-resume/);
            assert.match(worker,/bulkRecentlyActive/);
            assert.match(worker,/trial: failed history request backed off/);
            assert.match(messageRepo,/messages.deleted_ts IS NOT NULL/);
            assert.match(ingest,/observeHistoryBatch/);
            assert.match(ingest,/trialTrackedUpsert/);
            assert.match(ingest,/trialBatchCounters/);
            assert.match(archive,/api\/trial\/recovery/);
            assert.match(archive,/connection !==/);
            assert.match(archive,/trial-pairing-ui.js/);
            assert.match(fs.readFileSync("/opt/whatsapp-addon/archive-ui/index.html","utf8"),/trial-pairing-ui.js/);
            assert.match(fs.readFileSync("/opt/whatsapp-addon/archive-ui/index.html","utf8"),/trial-recovery-ui.js/);
            assert.match(run,/configureWhatsAppStorage\(.{2}\)/);
            assert.ok(!run.includes("configureWhatsAppStorage(opts.storage_path)"));
            console.log("Isolated pairing image checks passed");
          '

      - name: Syntax-check trial pairing UI and compiled modules (offline)
        run: |
          docker run --rm --network none --entrypoint node whatsapp-fullsync-trial:test --check /opt/whatsapp-addon/archive-ui/trial-pairing-ui.js
          docker run --rm --network none --entrypoint node whatsapp-fullsync-trial:test --check /opt/whatsapp-addon/archive-server.mjs
          docker run --rm --network none --entrypoint node whatsapp-fullsync-trial:test --check /opt/whatsapp-api/dist/whatsapp/connection.js

      - name: Run synthetic recovery and replay tests (offline)
        run: docker run --rm --network none --entrypoint node whatsapp-fullsync-trial:test --test /opt/whatsapp-addon/trial-recovery.test.mjs
