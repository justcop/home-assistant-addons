name: Python runtime containers
on:
  pull_request:
    paths:
      - '**/Dockerfile'
      - '**/requirements*.txt'
      - '.github/scripts/check_python_runtime.py'
      - '.github/workflows/python-runtime-containers.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: python-runtime-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      run_checks: ${{ steps.select.outputs.run_checks }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Select only affected add-ons and architectures
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import PurePosixPath

          addons = [
              "audioshelf", "lastfm_analytics", "money_locations",
              "music_video_companion", "work_audit", "vinyl_guardian", "python",
          ]
          shared = {
              ".github/scripts/check_python_runtime.py",
              ".github/workflows/python-runtime-containers.yml",
          }
          if os.environ["EVENT_NAME"] != "pull_request":
              selected = addons
          else:
              changed = subprocess.check_output(
                  ["git", "diff", "--name-only", os.environ["BASE_SHA"], "HEAD"],
                  text=True,
              ).splitlines()
              if any(path in shared for path in changed):
                  selected = addons
              else:
                  selected = [
                      addon for addon in addons
                      if any(
                          path.startswith(addon + "/")
                          and (
                              PurePosixPath(path).name == "Dockerfile"
                              or (
                                  PurePosixPath(path).name.startswith("requirements")
                                  and path.endswith(".txt")
                              )
                          )
                          for path in changed
                      )
                  ]
              print("Changed runtime paths:", changed)
          matrix = [
              {"addon": addon, "runner": runner, "arch": arch}
              for addon in selected
              for runner, arch in [
                  ("ubuntu-latest", "amd64"),
                  ("ubuntu-24.04-arm", "aarch64"),
              ]
              if not (addon == "vinyl_guardian" and arch == "aarch64")
          ]
          print("Runtime combinations:", matrix)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("matrix=" + json.dumps({"include": matrix}, separators=(",", ":")), file=output)
              print("run_checks=" + str(bool(matrix)).lower(), file=output)
          PY

  runtime:
    needs: select
    if: needs.select.outputs.run_checks == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.addon }}
          load: true
          tags: runtime:test
          build-args: |
            BUILD_VERSION=test
            BUILD_ARCH=${{ matrix.arch }}
          cache-from: type=gha,scope=runtime-${{ matrix.addon }}-${{ matrix.arch }}
          cache-to: type=gha,scope=runtime-${{ matrix.addon }}-${{ matrix.arch }},mode=max,ignore-error=true
      - name: Verify actual interpreter, native imports and offline functionality
        run: |
          interpreter=/usr/local/bin/python3
          case '${{ matrix.addon }}' in audioshelf|lastfm_analytics|money_locations) interpreter=/opt/venv/bin/python ;; esac
          docker run --rm --network none --entrypoint "$interpreter" \
            -v "$PWD/.github/scripts/check_python_runtime.py:/tmp/check_runtime.py:ro" \
            runtime:test -X faulthandler -u /tmp/check_runtime.py '${{ matrix.addon }}'
      - name: Verify server startup, access boundary and shutdown
        if: matrix.addon != 'vinyl_guardian' && matrix.addon != 'python'
        run: |
          docker run -d --network none --name runtime-smoke runtime:test
          trap 'docker logs runtime-smoke; docker rm -f runtime-smoke >/dev/null' EXIT
          interpreter=/usr/local/bin/python3
          case '${{ matrix.addon }}' in audioshelf|lastfm_analytics|money_locations) interpreter=/opt/venv/bin/python ;; esac
          for attempt in $(seq 1 15); do
            if docker exec runtime-smoke "$interpreter" -c "import urllib.request,urllib.error; url='http://127.0.0.1:8099/'+('' if '${{ matrix.addon }}'=='work_audit' else 'health'); expected=403 if '${{ matrix.addon }}'=='work_audit' else 200
          try:
              response=urllib.request.urlopen(url); status=response.status
          except urllib.error.HTTPError as exc:
              status=exc.code
          assert status==expected, status"; then
              docker stop --time 15 runtime-smoke
              exit 0
            fi
            sleep 2
          done
          exit 1
