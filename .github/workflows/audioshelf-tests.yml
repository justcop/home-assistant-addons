name: AudioShelf checks
on:
  push:
    paths: ["audioshelf/**", ".github/workflows/audioshelf-tests.yml"]
  pull_request:
    paths: ["audioshelf/**", ".github/workflows/audioshelf-tests.yml"]
  workflow_dispatch:
permissions:
  contents: read
# Multiple commits on a PR should not leave expensive duplicate test runs.
concurrency:
  group: audioshelf-tests-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r audioshelf/requirements.txt pytest==8.4.2 PyYAML==6.0.2
      - name: Check reviewed test inventory
        run: python audioshelf/scripts/test_inventory.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check audioshelf/app/static/app.js && node --check audioshelf/app/static/sw.js && node --check audioshelf/app/static/vinyl.js
      - name: Use preinstalled Chrome
        run: command -v google-chrome && google-chrome --version
      - run: npm install --no-save playwright@1.62.1
      - run: node audioshelf/tests/test_integrated_android.cjs && node audioshelf/tests/test_android_helper.cjs && node audioshelf/tests/test_ui.cjs && node audioshelf/tests/test_vinyl_ui.cjs && node audioshelf/tests/test_accounts_ui.cjs
        env:
          AUDIOSHELF_TEST_BROWSER: /usr/bin/google-chrome
      - run: python -m pytest audioshelf/tests -q
      - run: python -m compileall -q audioshelf/app && bash -n audioshelf/run.sh
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build add-on container
        uses: docker/build-push-action@v6
        with:
          context: ./audioshelf
          load: true
          tags: audioshelf:test
          build-args: |
            BUILD_VERSION=0.6.19
            BUILD_ARCH=amd64
          cache-from: type=gha,scope=audioshelf-tests
          cache-to: type=gha,scope=audioshelf-tests,mode=max,ignore-error=true
