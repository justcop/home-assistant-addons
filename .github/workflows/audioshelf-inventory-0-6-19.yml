name: Refresh AudioShelf 0.6.19 test inventory (temporary)
on:
  push:
    branches: [audioshelf-track-level-artist-credits]
    paths: ['.github/workflows/audioshelf-inventory-0-6-19.yml']
permissions:
  contents: write
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r audioshelf/requirements.txt pytest==8.4.2 PyYAML==6.0.2
      - name: Refresh reviewed inventory for per-track artist credits
        run: >
          python audioshelf/scripts/test_inventory.py --update --review-note
          "Reviewed generic MusicBrainz per-track artist credit matching in AudioShelf
          0.6.19, not an album- or artist-specific exception. The original
          Yellow Submarine is a regression example with 13 tracks and separate
          credited performers. Other tests require exact track-artist identity,
          preserve strict rejection of wrong artists, live versions and bad durations,
          confirm full 13-track Spotify match and playable MusicBrainz picker,
          and verify schema v4 to v5 migration preserves collected albums and manual
          mappings. Existing tracks with missing credits still use release-group
          artists until the user explicitly chooses a verified edition. MusicBrainz
          official release credits are canonical input; manual real-account
          verification is still needed."
      - name: Commit reviewed test inventory
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audioshelf/TEST_INVENTORY.md
          git commit -m 'Review AudioShelf 0.6.19 track-level artist matching tests'
          git push origin HEAD:audioshelf-track-level-artist-credits
