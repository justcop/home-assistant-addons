name: Refresh AudioShelf 0.6.18 account browser inventory (temporary)
on:
  push:
    branches: [audioshelf-playable-release-selection]
    paths: ['.github/workflows/audioshelf-inventory-account-final.yml']
permissions:
  contents: write
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r audioshelf/requirements.txt pytest==8.4.2 PyYAML==6.0.2
      - name: Refresh reviewed multi-account test inventory
        run: >
          python audioshelf/scripts/test_inventory.py --update --review-note
          "Reviewed account-isolation browser regression for Spotify-verified
          MusicBrainz editions. Alice intentionally disconnects Spotify and
          tries Add to shelf; the UI refuses to add an unverified album while
          preserving an empty personal shelf. She reconnects her own Spotify,
          chooses a fully matched MusicBrainz edition and adds a mapped album.
          Bob and owner libraries, sessions and preferences remain independent.
          The browser fixture now supplies Spotify album-search and track
          metadata to each connected account while retaining distinct device
          identifiers and tokens. Other Classic and Vinyl release-picker
          browser checks passed in the previous run; full tests rerun here."
      - name: Commit reviewed inventory
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audioshelf/TEST_INVENTORY.md
          git commit -m 'Review AudioShelf 0.6.18 multi-user release matching'
          git push origin HEAD:audioshelf-playable-release-selection
