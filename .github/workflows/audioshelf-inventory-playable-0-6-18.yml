name: Refresh reviewed AudioShelf 0.6.18 test inventory (temporary)
on:
  push:
    branches: [audioshelf-playable-release-selection]
    paths: ['.github/workflows/audioshelf-inventory-playable-0-6-18.yml']
permissions:
  contents: write
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r audioshelf/requirements.txt pytest==8.4.2 PyYAML==6.0.2
      - name: Recalculate reviewed test checksums
        run: >
          python audioshelf/scripts/test_inventory.py --update --review-note
          "Reviewed AudioShelf 0.6.18 Spotify-verified MusicBrainz selection.
          The new focused backend tests show partially matched tracklists absent
          from the release picker, complete editions with extra Spotify bonus
          tracks eligible, no mutation on invalid selection, atomic verified
          shelf addition, first-play review retained, existing-album release
          replacement, disconnected Spotify feedback, cursor validation and
          paginated discovery. Browser fixtures and integrations now select a
          complete edition through the picker and keep cover-art choices separate.
          User-visible existing unplayable albums gain Find playable edition,
          while existing shelf and manual maps stay unchanged unless confirmed.
          Spotify matching availability, MusicBrainz pagination latency and
          rate-limiting must be verified on real Spotify accounts."
      - name: Save reviewed test inventory
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audioshelf/TEST_INVENTORY.md
          git commit -m 'Review AudioShelf playable release selector tests'
          git push origin HEAD:audioshelf-playable-release-selection
