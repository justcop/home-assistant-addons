name: Propose WhatsApp image-only rollback
on:
  workflow_dispatch:
    inputs:
      known_good_commit:
        description: "Previously verified repository SHA (40 hex characters)"
        required: true
        type: string
permissions:
  contents: write
  pull-requests: write
jobs:
  rollback-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare executable-source rollback PR (no data changes)
        env:
          GOOD: ${{ inputs.known_good_commit }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GOOD" =~ ^[a-fA-F0-9]{40}$ ]]; then
            echo "::error::Invalid commit SHA"; exit 1
          fi
          git cat-file -e "$GOOD^{commit}"
          if ! git merge-base --is-ancestor "$GOOD" HEAD; then
            echo "::error::Rollback source must be an ancestor of main; do not use arbitrary code"
            exit 1
          fi
          BRANCH="recovery/whatsapp-image-${GOOD:0:12}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          mapfile -t good_files < <(git ls-tree -r --name-only "$GOOD" whatsapp_mcp/ |
            grep -vE '^whatsapp_mcp/(config.yaml|README.md|upstream_guard.py|tests/|\\.delivery/|\\.)' || true)
          for file in "${good_files[@]}"; do git restore --source "$GOOD" -- "$file"; done
          mapfile -t now_files < <(git ls-files whatsapp_mcp/ |
            grep -vE '^whatsapp_mcp/(config.yaml|README.md|upstream_guard.py|tests/|\\.delivery/|\\.)' || true)
          for file in "${now_files[@]}"; do
            if ! git cat-file -e "$GOOD:$file" 2>/dev/null; then git rm -f -- "$file"; fi
          done
          git add whatsapp_mcp
          if git diff --cached --quiet; then
            echo "::error::No source difference"; exit 1
          fi
          git commit -m "recovery(whatsapp): candidate image-only rollback"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "recovery(whatsapp): restore executable source from ${GOOD:0:12} [MANUAL]" \
            --body "Source-only rollback PR. No live WhatsApp database, STORAGE volume, private tokens, or HA state is modified. Review privacy regression tests; publish a new image version and manually install only after testing. Never restore old message databases."
