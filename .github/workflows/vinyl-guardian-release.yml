name: Publish Vinyl Guardian update

on:
  push:
    branches: [main]
    paths:
      - 'vinyl_guardian/**'
      - '.github/scripts/vinyl_guardian_release.py'
      - '.github/workflows/vinyl-guardian-release.yml'
  workflow_dispatch:
    inputs:
      bump:
        description: Delivery version increment
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: write
  packages: write

# Publish only installed main runtime changes.
concurrency:
  group: vinyl-guardian-delivery
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install configuration parser
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Validate release automation and stable runtime
        run: |
          python -m unittest discover -s .github/scripts/tests -v
          python -m compileall -q vinyl_guardian
          bash -n vinyl_guardian/run.sh
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish pre-built add-on images
        shell: bash
        run: |
          VERSION="$(python - <<'PY'
          import yaml
          print(yaml.safe_load(open('vinyl_guardian/config.yaml'))['version'])
          PY
          )"
          for ARCH in amd64 aarch64; do
            docker buildx build vinyl_guardian \
              --platform "linux/$ARCH" \
              --build-arg "BUILD_ARCH=$ARCH" \
              --build-arg "BUILD_VERSION=$VERSION" \
              --tag "ghcr.io/justcop/vinyl-guardian-$ARCH:$VERSION" \
              --push
          done
      - name: Publish main version
        env:
          BUMP: ${{ inputs.bump || 'auto' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python .github/scripts/vinyl_guardian_release.py --bump "$BUMP"
            git add vinyl_guardian/config.yaml .github/vinyl-guardian-release-state.json
            if git diff --cached --quiet; then
              echo 'No main runtime changes to publish.'
              exit 0
            fi
            git commit -m 'chore: publish Vinyl Guardian delivery update'
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo 'Main changed repeatedly; retry this workflow.' >&2
          exit 1
