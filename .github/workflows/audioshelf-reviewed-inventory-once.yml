name: Refresh reviewed AudioShelf inventory (one-time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audioshelf-reviewed-inventory-once.yml'
permissions:
  contents: write
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r audioshelf/requirements.txt pytest PyYAML
      - name: Review and regenerate test inventory
        run: |
          python audioshelf/scripts/test_inventory.py --update --review-note "Reviewed integrated Android origin-scoped bridge smoke tests, short-lived server-owned Spotify jobs, unchanged standalone PWA behaviour and account-partitioned, read-only offline snapshot allowlist. Android JVM tests and lint passed in the build workflow. The new JavaScript smoke test is executed in AudioShelf CI; end-to-end device wake, notifications and offline storage still require manual device verification."
      - name: Commit reviewed inventory only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audioshelf/TEST_INVENTORY.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "AudioShelf: update reviewed test inventory for Android integration"
          git push
