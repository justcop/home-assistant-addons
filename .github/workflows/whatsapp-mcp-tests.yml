name: WhatsApp MCP app tests
on:
  pull_request:
    paths:
      - 'whatsapp_mcp/**'
      - '.github/workflows/whatsapp-mcp-tests.yml'
  push:
    branches: [main]
    paths:
      - 'whatsapp_mcp/**'
      - '.github/workflows/whatsapp-mcp-tests.yml'
  workflow_dispatch:
jobs:
  security-and-container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Node security regression tests
        run: node --test whatsapp_mcp/tests/*.test.mjs
      - name: Syntax check browser UI and launcher
        run: |
          node --check whatsapp_mcp/archive-ui/app.js
          node --check whatsapp_mcp/run.mjs
          node --check whatsapp_mcp/storage.mjs
          node --check whatsapp_mcp/prune-meta-ai.mjs
          node --check whatsapp_mcp/patch-upstream.mjs
          node --check whatsapp_mcp/archive-data.mjs
          node --check whatsapp_mcp/review-data.mjs
      - name: Check app branding files
        run: |
          file whatsapp_mcp/icon.png whatsapp_mcp/logo.png
          file whatsapp_mcp/icon.png | grep -q 'PNG image data, 128 x 128'
          file whatsapp_mcp/logo.png | grep -q 'PNG image data, 500 x 200'
      - name: Build pinned upstream WhatsApp API and MCP app
        run: docker build -t whatsapp-mcp-addon:ci whatsapp_mcp
