name: Music Video Companion tests
on:
  push:
    paths:
      - "music_video_companion/**"
      - ".github/workflows/music-video-companion-tests.yml"
  pull_request:
    paths:
      - "music_video_companion/**"
      - ".github/workflows/music-video-companion-tests.yml"
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s music_video_companion/tests -v
      - run: python -m compileall -q music_video_companion/app
