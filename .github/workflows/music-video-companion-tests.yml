name: Music Video Companion tests
on:
  push:
    branches: [main]
    paths:
      - "music_video_companion/**"
      - ".github/workflows/music-video-companion-tests.yml"
  pull_request:
    paths:
      - "music_video_companion/**"
      - ".github/workflows/music-video-companion-tests.yml"
concurrency:
  group: music-video-companion-tests-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - run: python -m unittest discover -s music_video_companion/tests -v
      - run: python -m compileall -q music_video_companion/app
      - run: node --check music_video_companion/app/app.js
