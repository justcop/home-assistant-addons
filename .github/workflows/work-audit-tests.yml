name: Work Audit checks
on:
  push:
    paths: ["work_audit/**", ".github/workflows/work-audit-tests.yml"]
  pull_request:
    paths: ["work_audit/**", ".github/workflows/work-audit-tests.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - run: pip install -r work_audit/requirements.txt
      - run: python -m compileall -q work_audit
      - run: python -m unittest discover -s work_audit -p 'test_*.py' -v
        env:
          PYTHONPATH: work_audit
