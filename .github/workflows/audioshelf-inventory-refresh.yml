name: AudioShelf test inventory refresh (temporary)
on:
  push:
    branches: [audioshelf-play-accepted-return]
    paths: ['.github/workflows/audioshelf-inventory-refresh.yml']
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r audioshelf/requirements.txt pytest==8.4.2 PyYAML==6.0.2
      - name: Review and generate the current test list
        run: >
          python audioshelf/scripts/test_inventory.py --update --review-note
          "Reviewed the 296 previous backend tests and two new distinct regressions:
          Play API acceptance is visible independently from Spotify's final track confirmation;
          ambiguous network failure never reports acceptance or repeats the command.
          Reviewed Android parser and return-policy tests for safe 20-second fallback and
          device discovery timing. Manual Pixel cold-start validation remains required."
      - name: Commit updated reviewed inventory
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audioshelf/TEST_INVENTORY.md
          git commit -m 'Review AudioShelf 298-case test inventory'
          git push origin HEAD:audioshelf-play-accepted-return
