name: Dependabot reviewer safety tests

on:
  push:
    paths:
      - '.github/scripts/dependency_review/**'
      - '.github/workflows/dependabot-ai-reviewer.yml'
      - '.github/workflows/dependabot-reviewer-tests.yml'
      - '.github/dependabot.yml'
  pull_request:
    paths:
      - '.github/scripts/dependency_review/**'
      - '.github/workflows/dependabot-ai-reviewer.yml'
      - '.github/workflows/dependabot-reviewer-tests.yml'
      - '.github/dependabot.yml'

permissions:
  contents: read

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - run: python -m unittest discover -s .github/scripts/dependency_review -p 'test_*.py' -v
      - run: python -m compileall -q .github/scripts/dependency_review
