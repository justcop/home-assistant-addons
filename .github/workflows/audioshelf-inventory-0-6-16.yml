name: Refresh AudioShelf test inventory (temporary)
on:
  push:
    branches: [audioshelf-faster-discovery-live-playback]
    paths: ['.github/workflows/audioshelf-inventory-0-6-16.yml']
permissions:
  contents: write
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r audioshelf/requirements.txt pytest==8.4.2 PyYAML==6.0.2
      - name: Review and refresh inventory
        run: >
          python audioshelf/scripts/test_inventory.py --update --review-note
          "Reviewed two new independent backend tests: cold-start discovery polls every 500ms for
          the first five seconds, then taper while preserving configured shorter intervals;
          authenticated owner snapshots expose safe phase and Play-accepted progress without
          leaking helper tokens. Reviewed changed Android helper browser contract tests for
          live status text, accepted-versus-confirmed playback and visible-page polling taper.
          Existing device pinning, expiry, account scoping and cancellation tests remain intact.
          Real device timing and Spotify rate-limit behaviour require manual verification."
      - name: Commit reviewed inventory
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audioshelf/TEST_INVENTORY.md
          git commit -m 'Review AudioShelf 0.6.16 test inventory'
          git push origin HEAD:audioshelf-faster-discovery-live-playback
