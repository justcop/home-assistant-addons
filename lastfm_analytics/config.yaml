name: Listening Analytics
version: "0.2.16"
slug: lastfm_analytics
description: A clear, local view of your Last.fm listening, with reversible song and album grouping.
url: https://github.com/justcop/home-assistant-addons/tree/main/lastfm_analytics
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
stage: experimental
ingress: true
ingress_port: 8099
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Optional web interface and authenticated Vinyl Guardian reporting. Use an HTTPS reverse proxy for remote web access.
panel_icon: mdi:chart-timeline-variant
panel_title: Listening Analytics
panel_admin: true
backup: cold
timeout: 30
watchdog: http://[HOST]:8099/health
options:
  audioshelf_url: ""
  source_api_token: ""
  username: ""
  api_key: ""
  timezone: Europe/London
  sync_interval_seconds: 300
  reconcile_days: 7
  demo_mode: false
  artwork_lookups: true
  web_password: ""
schema:
  audioshelf_url: str?
  source_api_token: password?
  username: str?
  api_key: password?
  timezone: str
  sync_interval_seconds: int(60,86400)
  reconcile_days: int(2,90)
  demo_mode: bool
  artwork_lookups: bool
  web_password: password?
