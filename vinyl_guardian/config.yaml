name: Vinyl Guardian
description: Detects needle drops, IDs vinyl records, and natively scrobbles to Last.fm.
version: "5.10.11"
slug: vinyl_guardian
init: false
arch:
- aarch64
- amd64
startup: application
boot: auto
options:
  listening_analytics_url: ''
  listening_analytics_token: ''
  recording_directory: /share/vinyl_guardian
  lastfm_username: ''
  lastfm_password: ''
  lastfm_api_key: ''
  lastfm_api_secret: ''
  mqtt_broker: core-mosquitto
  mqtt_port: 1883
  mqtt_user: ''
  mqtt_password: ''
  test_capture_mode: false
  calibration_mode: false
  recording_seconds: 10
  debug_logging: false
  audio_source: auto
  audio_scan_on_start: false
  audio_scan_seconds: 2.5
  data_collection_enabled: false
  data_collection_label: unlabelled
  data_collection_raw_audio: false
  data_collection_feature_interval: 0.25
  data_collection_raw_segment_minutes: 30
  diagnostic_capture_mode: normal
  experiment_harness_enabled: true
  auto_capture_interesting_events: true
  advanced:
    max_attempts: 3
    min_audio_seconds: 5
    audio_onset_threshold: 1000
    trigger_debounce_chunks: 3
    needle_lift_seconds: 15
    consecutive_failure_timeout: 1800
    fallback_sleep_secs: 60
  calibration_record_rpm: 33⅓
  reuse_calibration_audio: true
schema:
  listening_analytics_url: str?
  listening_analytics_token: password?
  recording_directory: str
  lastfm_username: str?
  lastfm_password: password?
  lastfm_api_key: str?
  lastfm_api_secret: str?
  mqtt_broker: str
  mqtt_port: port
  mqtt_user: str?
  mqtt_password: password?
  test_capture_mode: bool
  calibration_mode: bool
  recording_seconds: int
  debug_logging: bool
  audio_source: str
  audio_scan_on_start: bool
  audio_scan_seconds: float
  data_collection_enabled: bool
  data_collection_label: str
  data_collection_raw_audio: bool
  data_collection_feature_interval: float
  data_collection_raw_segment_minutes: int
  diagnostic_capture_mode: list(normal|known_off|listening_session)
  experiment_harness_enabled: bool
  auto_capture_interesting_events: bool
  advanced:
    max_attempts: int
    min_audio_seconds: int
    audio_onset_threshold: int
    trigger_debounce_chunks: int
    needle_lift_seconds: int
    consecutive_failure_timeout: int
    fallback_sleep_secs: int
  calibration_record_rpm: list(33⅓|45)
  reuse_calibration_audio: bool
map:
- share:rw
- media:rw
audio: true
hassio_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:record-circle
panel_title: Vinyl Guardian
