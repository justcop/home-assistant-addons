name: "Vikunja ChatGPT MCP Bridge (experimental)"
version: "0.1.0"
slug: "vikunja_chatgpt_bridge"
description: "OAuth-enabled Vikunja MCP adapter for ChatGPT, based on Jacob-Tate/vikunja-mcp"
url: "https://github.com/Jacob-Tate/vikunja-mcp"
init: false
startup: services
boot: auto
arch:
  - amd64
ports:
  3000/tcp: 3000
ports_description:
  3000/tcp: "MCP OAuth HTTP service (behind Cloudflare Tunnel)"
options:
  vikunja_url: "https://vikunja.example.com"
  mcp_base_url: "https://mcp.example.com"
  vikunja_token: ""
  mcp_auth_password: ""
  jwt_secret: ""
schema:
  vikunja_url: str
  mcp_base_url: str
  vikunja_token: password
  mcp_auth_password: password
  jwt_secret: password
